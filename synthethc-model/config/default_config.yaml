# Default configuration for the synthetic financial data generator
# All counts are approximate targets - actual counts may vary slightly

population:
  people: 100000
  companies: 10000
  institutions: 100
  accounts: 180000
  payment_accounts: 50000
  devices: 150000
  ip_records: 300000
  addresses: 120000
  invoices: 300000
  events: 1000000
  relationships: 2000000
  transactions: 5000000

temporal:
  start_date: "2022-01-01"
  end_date: "2026-12-31"
  salary_day_range: [25, 5]  # salary paid between 25th and 5th
  business_hours: [8, 18]
  peak_personal_hours: [18, 22]

quality:
  missing_data_rates:
    phone: 0.03
    email: 0.04
    address: 0.04
    occupation: 0.01
    device_id: 0.02
    ip_address: 0.025
    invoice_id: 0.08
    employer: 0.015
    reference: 0.05
    location: 0.02
    grandfather_name: 0.06
  duplicate_rate: 0.005
  near_duplicate_rate: 0.015
  typo_rate: 0.003
  format_error_rate: 0.005
  stale_record_rate: 0.02

behaviors:
  normal: 0.55
  remote_worker: 0.10
  freelancer: 0.08
  business_owner: 0.06
  international_worker: 0.04
  high_income_worker: 0.03
  student: 0.08
  government_worker: 0.06

risk_patterns:
  structuring: 0.015
  layering: 0.01
  money_mule: 0.01
  circular_transactions: 0.005
  rapid_fund_movement: 0.008
  dormant_activation: 0.005
  foreign_income_anomaly: 0.01
  shared_device_network: 0.005
  invoice_anomaly: 0.005

generation:
  batch_size: 10000
  transaction_batch_size: 50000
  parquet_compression: "snappy"
  csv_sample_size: 10000
  partition_by: "year"

demographics:
  male_ratio: 0.52
  female_ratio: 0.48
  age_distribution:
    min: 18
    max: 75
    mean: 32
    std: 12
  urban_ratio: 0.65
  ethiopia_ratio: 0.92  # % of people who are Ethiopian
  foreign_worker_ratio: 0.08

accounts_per_person:
  min: 1
  max: 5
  mean: 1.8
  weights: [0.30, 0.35, 0.20, 0.10, 0.05]  # probability of 1,2,3,4,5 accounts

devices_per_person:
  min: 1
  max: 4
  mean: 1.5
  weights: [0.45, 0.35, 0.15, 0.05]  # probability of 1,2,3,4 devices

transactions_per_person:
  min: 10
  max: 500
  mean: 50

seasonality:
  holiday_months: [1, 9, 12]  # Ethiopian Christmas (Jan), New Year (Sep), etc.
  holiday_spending_multiplier: 1.4
  year_end_business_multiplier: 1.3
  school_payment_months: [9, 10, 2, 3]
  vacation_months: [7, 8]
  vacation_spending_multiplier: 1.2

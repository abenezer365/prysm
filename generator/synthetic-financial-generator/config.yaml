# Currencies
currencies:
  primary: "ETB"
  foreign: ["USD", "EUR", "GBP", "AED", "CHF"]
  fx_rates_to_etb:
    ETB: 1.0
    USD: 57.5
    EUR: 62.0
    GBP: 72.0
    AED: 15.6
    CHF: 65.0


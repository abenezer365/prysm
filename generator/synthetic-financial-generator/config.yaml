dataset:
  persons: 100000
  companies: 10000
  accounts: 150000
  banks: 20
  devices: 90000
  invoices: 200000
  transactions: 700000
  relationships: 500000
  ground_truth: 5000

temporal:
  start_date: "2022-01-01"
  end_date: "2026-12-31"
  reference_date: "2026-01-01"

seed: 42

output:
  format: "parquet"
  compression: "zstd"
  row_group_size: 100000
  batch_size: 10000

data_quality:
  missing_rate: 0.02
  duplicate_rate: 0.01
  column_missing_rates:
    phone_hash: 0.05
    address_hash: 0.08
    browser: 0.03
    invoice_id: 0.15
    device_id: 0.05
    closed_at: 0.70
    employment_status: 0.03

realism:
  ethiopian_focus: 0.70
  foreign_remote_workers: 0.15
  suspicious_entities: 0.05

# Ethiopian cities with weighted distribution
cities:
  Addis Ababa:    0.35
  Dire Dawa:      0.07
  Mekelle:        0.06
  Gondar:         0.05
  Hawassa:        0.06
  Bahir Dar:      0.05
  Adama:          0.05
  Jimma:          0.04
  Dessie:         0.04
  Jijiga:         0.03
  Shashamane:     0.03
  Bishoftu:       0.03
  Sodo:           0.02
  Arba Minch:     0.02
  Hosaena:        0.02
  Harar:          0.02
  Dilla:          0.02
  Nekemte:        0.02
  Asella:         0.01
  Debre Birhan:   0.01

# City to region mapping
city_region_map:
  Addis Ababa: "Addis Ababa"
  Dire Dawa: "Dire Dawa"
  Mekelle: "Tigray"
  Gondar: "Amhara"
  Hawassa: "Sidama"
  Bahir Dar: "Amhara"
  Adama: "Oromia"
  Jimma: "Oromia"
  Dessie: "Amhara"
  Jijiga: "Somali"
  Shashamane: "Oromia"
  Bishoftu: "Oromia"
  Sodo: "SNNPR"
  Arba Minch: "SNNPR"
  Hosaena: "SNNPR"
  Harar: "Harari"
  Dilla: "SNNPR"
  Nekemte: "Oromia"
  Asella: "Oromia"
  Debre Birhan: "Amhara"

# Occupation distribution (must sum to 1.0)
occupations:
  software_engineer:  0.06
  teacher:            0.08
  doctor:             0.02
  nurse:              0.03
  business_owner:     0.07
  freelancer:         0.10
  student:            0.12
  farmer:             0.08
  merchant:           0.07
  driver:             0.05
  day_laborer:        0.06
  government_employee: 0.07
  accountant:         0.03
  lawyer:             0.02
  engineer:           0.04
  cashier:            0.04
  security_guard:     0.04
  domestic_worker:    0.03
  ngo_worker:         0.03
  unemployed:         0.06

# Income ranges per occupation: [min_etb, max_etb, currency]
income_by_occupation:
  software_engineer:   [15000, 60000, "ETB"]
  teacher:             [5000,  18000, "ETB"]
  doctor:              [18000, 80000, "ETB"]
  nurse:               [8000,  22000, "ETB"]
  business_owner:      [12000, 120000, "ETB"]
  freelancer:          [8000,  50000, "ETB"]
  student:             [2000,  8000, "ETB"]
  farmer:              [3000,  12000, "ETB"]
  merchant:            [8000,  40000, "ETB"]
  driver:              [5000,  15000, "ETB"]
  day_laborer:         [2000,  7000, "ETB"]
  government_employee: [6000,  25000, "ETB"]
  accountant:          [10000, 30000, "ETB"]
  lawyer:              [15000, 60000, "ETB"]
  engineer:            [12000, 45000, "ETB"]
  cashier:             [4000,  12000, "ETB"]
  security_guard:      [3500,  10000, "ETB"]
  domestic_worker:     [2500,  8000, "ETB"]
  ngo_worker:          [10000, 35000, "ETB"]
  unemployed:          [0,     5000, "ETB"]

# Employment status logic by occupation
employment_by_occupation:
  student: "Student"
  unemployed: "Unemployed"
  farmer: "Self-Employed"
  business_owner: "Self-Employed"
  freelancer: "Self-Employed"
  merchant: "Self-Employed"
  default: "Employed"

